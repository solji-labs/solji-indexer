# docker-compose.yml
version: '3.8'

services:
  # Nginx reverse proxy service
  nginx:
    image: nginx:alpine
    container_name: solji_nginx
    restart: always
    ports:
      - "8091:80"
    # network_mode: "host"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sonia-indexer


  # indexer services
  sonia-indexer:
      image: sonia831/solji-indexer:v4.4.5
      container_name: solji_indexer_sonia
      restart: always
