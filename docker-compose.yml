# docker-compose.yml
version: '3.8'

services:
  # Nginx reverse proxy service
  nginx:
    image: nginx:alpine
    container_name: solji_nginx
    restart: always
    ports:
      - "8091:80"
    # network_mode: "host"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sonia-indexer


  # indexer service
  sonia-indexer:
      image: sonia831/solji-indexer:v1.1.0
      container_name: solji_indexer_sonia
      restart: always
      # network_mode: "host"
      environment:
        - RUST_LOG=trace
        - API_PORT=8080
        - DATABASE_URL=mysql://root:Solji123@185.234.74.185:33306/solji_db
        - SOLANA_RPC_URL=https://api.devnet.solana.com
