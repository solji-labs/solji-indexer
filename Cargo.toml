# solji-indexer/Cargo.toml

[package]
name = "solji-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
# Solana
solana-client = "3.0.5"
solana-sdk = "3.0.0"
anchor-lang = { version = "0.31.1", features = ["derive"] }
# WebSocket for real-time event listening
tokio-tungstenite = "0.21"
futures-util = "0.3"

# programs
temple = { path = "../solji-program/anchor/programs/temple", features = [
    "idl-build",
] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# environment
dotenvy = "0.15"
# database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "mysql",
    "macros",
    "time",
    "chrono",
] }
# chrono 
chrono = { version = "0.4", features = ["serde"] }
# Decimal
rust_decimal = { version = "1.0", features = ["serde"] }
# API
axum = "0.8.6"
