# solji-indexer/Cargo.toml

[package]
name = "solji-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
# Solana
solana-client = "3.0.5"
solana-sdk = "3.0.0"
anchor-lang = { version = "0.31.1", features = ["derive"] }
# WebSocket for real-time event listening
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"


# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# base64 for event parsing
base64 = "0.22"
# borsh for Anchor event deserialization
borsh = "0.10.3"
# hex encoding
hex = "0.4"
# environment
dotenvy = "0.15"
# database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "mysql",
    "macros",
    "time",
    "chrono",
] }
# chrono 
chrono = { version = "0.4", features = ["serde"] }
# Decimal
rust_decimal = { version = "1.0", features = ["serde"] }
# API
axum = "0.8.6"
tower-http = { version = "0.6.1", features = ["cors"] }
# OpenAPI and Swagger UI
utoipa = { version = "5.1.1", features = ["axum_extras", "debug"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
utoipa-axum = { version = "0", features = ["debug"] }
